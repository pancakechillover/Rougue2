name: Sync to ScholarDungeon

on:
  # Rougue2 的 main 有新提交时自动同步
  push:
    branches:
      - main

  # 也允许手动点击按钮同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载仓库 B：Rougue2
      - name: Checkout Rougue2
        uses: actions/checkout@v4
        with:
          path: source

      # 2. 下载仓库 A：ScholarDungeon
      - name: Checkout ScholarDungeon
        uses: actions/checkout@v4
        with:
          repository: pancakechillover/ScholarDungeon
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main
          path: target

      # 3. 用 Rougue2 的内容覆盖 ScholarDungeon
      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            source/ target/

      # 4. 如果有变化，就提交到 ScholarDungeon
      - name: Commit and push
        run: |
          cd target

          git config user.name "Rougue2 Sync Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Sync from Rougue2"
          git push origin main
